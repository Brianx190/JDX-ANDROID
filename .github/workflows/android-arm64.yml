name: JDX Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract source archive
        run: |
          test -f JDX-ANDROID-codigo-ARM64.zip
          mkdir -p source
          unzip -q JDX-ANDROID-codigo-ARM64.zip -d source
          test -f source/.ci/android/build.sh
          test -f source/src/android/gradlew

      - name: Build Android APK (first attempt)
        working-directory: source
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh --target standard --build-type Debug

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JDX-ANDROID-build-output
          path: |
            source/artifacts/**/*.apk
            source/artifacts/**/*.aab
            source/src/android/app/build/outputs/**/*.apk
          if-no-files-found: warn
          
